[mod-setting-name]
wp-drone-swarms-hard-mode=Hard mode: drones need a laser turret
wp-attack-drone-laser-style=Laser style

[mod-setting-description]
wp-drone-swarms-hard-mode=Adds a laser turret to every attack drone's recipe. Since drones are one-way, each swarm costs a stack of turrets.
wp-attack-drone-laser-style=Pulsing: each drone's beam stays locked on its target for 3 seconds, rests for 1, then fires again. Continuous: the beam never stops. Damage per second is the same.

