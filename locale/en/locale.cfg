[mod-name]
WePlayDroneSwarms=WePlay: Laser-Equipped Drone Swarms

[mod-description]
WePlayDroneSwarms=Swarms of laser drones that clear biter nests far beyond your walls. Drones launch one at a time and circle the launchpad until the swarm is ready, then fly out together, whirl around the nests and pulse-laser everything in sight. An alternative to artillery.

[entity-name]
wp-attack-drone-launchpad=Attack drone launchpad

[entity-description]
wp-attack-drone-launchpad=Launches attack drones one at a time. They circle overhead until the squad is big enough, then fly out to the nearest charted nest, scatter into rings around it and laser it until their batteries run dry.

[item-name]
wp-attack-drone-launchpad=Attack drone launchpad
wp-attack-drone=Attack drone

[item-description]
wp-attack-drone=A one-way laser drone. Load it into an attack drone launchpad.

[technology-name]
wp-attack-drones=Attack drones
wp-attack-drone-endurance=Drone endurance
wp-attack-drone-swarm-size=Swarm size

[technology-description]
wp-attack-drone-endurance=Bigger batteries: attack drones keep up their attack run for longer before they go down.
wp-attack-drone-swarm-size=Launchpads can gather bigger swarms before they fly out.
wp-attack-drones=Laser drone swarms that clear enemy nests up to 1000 tiles away. The nests will retaliate against the launchpad, just like with artillery.

